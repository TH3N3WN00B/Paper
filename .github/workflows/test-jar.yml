# Builds a downloadable Paper (paperclip) jar from one pinned commit, so people can test
# https://github.com/PaperMC/Paper/pull/14467 without building it themselves.
# To build a newer PR commit, update PAPER_COMMIT and push this branch.

name: Test jar (PR 14467)

on:
  push:
    branches: [ test-jar ]
  workflow_dispatch:

jobs:
  paperclip:
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: "14467"
      PAPER_COMMIT: 95c9d007f83a7d31e3fc731e954a04ae0a3ec9d4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.PAPER_COMMIT }}
          fetch-depth: 0

      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyPatches --stacktrace

      - name: Create Paperclip Jar
        run: ./gradlew createPaperclipJar --stacktrace

      - name: Name the jar and write its checksum
        run: |
          mkdir out
          cp paper-server/build/libs/paper-paperclip-*.jar "out/paper-26.3-zstd-pr${PR_NUMBER}-${PAPER_COMMIT:0:9}.jar"
          cd out
          sha256sum *.jar | tee SHA256SUMS.txt
          echo "Built from commit ${PAPER_COMMIT}" >> SHA256SUMS.txt

      - name: Upload Jar
        uses: actions/upload-artifact@v7
        with:
          name: paper-26.3-zstd-pr14467-95c9d007f
          path: out/*
          retention-days: 90
